name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the automated tests
        type: boolean
        default: false
      debug:
        description: Also build Debug
        type: boolean
        default: false
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true
      - name: Configure Visual Studio x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }} -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Build Debug
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        run: cmake --build build --config Debug --parallel 2
      - name: Run tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
        run: |
          $env:PATH = "$PWD/build/vcpkg_installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/ApexOfficeReader.exe package/
          Copy-Item build/vcpkg_installed/x64-windows/bin/*.dll package/
          windeployqt --release package/ApexOfficeReader.exe
          Compress-Archive -Path package/* -DestinationPath ApexOfficeReader-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ApexOfficeReader-windows-x64
          path: ApexOfficeReader-windows-x64.zip
